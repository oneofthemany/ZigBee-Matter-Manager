<!DOCTYPE html>
<!--
  ZigBee Manager — OpenZone Cast receiver.

  Plays timestamped PCM chunks pushed over a same-origin WebSocket, scheduled
  sample-accurately with the Web Audio API against the ZMM server clock
  (estimated NTP-style over the same socket). Per-device trim (±ms) compensates
  the device's fixed audio-output latency. See static/cast/README.md for
  registration; this page must be served over plain HTTP from the ZMM sync
  listener (media.cast.sync.http_port) so the ws:// socket is same-origin.

  It also draws the now-playing screen. The default media receiver cannot:
  its metadata rides in on the load that starts the stream and there is no way
  to revise it while the stream runs, so a zone's screens sit under one label
  for the whole session (docs/open-zone.md §10.7). Here the server pushes each
  item over the same socket, stamped with the server-clock instant the seam is
  *heard* — the clock this page already estimates to schedule its audio — so
  the screen turns over with the speakers rather than with the decoder.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>ZMM Sync Receiver</title>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #000; color: #fff;
      font-family: "Roboto", system-ui, sans-serif; overflow: hidden; }

    /* Blurred cover behind everything — on a screened device the art is the
       point, and a hard-edged 320px thumbnail on black is not. */
    #bg { position: fixed; inset: -8vh; background-size: cover;
      background-position: center; filter: blur(7vh) saturate(1.4)
      brightness(.45); transform: scale(1.1); opacity: 0;
      transition: opacity .6s ease; }
    #shade { position: fixed; inset: 0;
      background: radial-gradient(ellipse at center,
        rgba(0,0,0,.25) 0%, rgba(0,0,0,.8) 100%); }

    #wrap { position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; gap: 5vw; padding: 6vh 7vw; }

    #art { width: 46vh; height: 46vh; flex: 0 0 auto; border-radius: 1.6vh;
      background: #151515 center/cover no-repeat;
      box-shadow: 0 2vh 6vh rgba(0,0,0,.65); display: none; }

    #text { min-width: 0; max-width: 52vw; }
    #title { font-size: 6vh; font-weight: 700; line-height: 1.12;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3;
      -webkit-box-orient: vertical; }
    #artist { font-size: 3.4vh; opacity: .72; margin-top: 1.4vh;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #pos { margin-top: 3.4vh; display: none; }
    #bar { height: .7vh; border-radius: .7vh; background: rgba(255,255,255,.22);
      overflow: hidden; }
    #fill { height: 100%; width: 0; background: #fff; border-radius: .7vh; }
    #times { display: flex; justify-content: space-between; margin-top: 1.2vh;
      font-size: 2vh; opacity: .6; font-variant-numeric: tabular-nums; }
    #track { font-size: 2.2vh; opacity: .55; margin-top: 2.2vh;
      letter-spacing: .12em; text-transform: uppercase; }

    /* Session status, deliberately small: it is for whoever is aligning the
       zone, not for whoever is listening to it. */
    #foot { position: fixed; left: 0; right: 0; bottom: 2.2vh;
      display: flex; align-items: center; justify-content: center; gap: 1.4vh;
      font-size: 1.8vh; opacity: .42; font-variant-numeric: tabular-nums; }
    #pulse { width: 1.4vh; height: 1.4vh; border-radius: 50%; background: #2a6;
      opacity: .25; transition: opacity .1s; flex: 0 0 auto; }
  </style>
</head>
<body>
  <div id="bg"></div>
  <div id="shade"></div>
  <div id="wrap">
    <div id="art"></div>
    <div id="text">
      <div id="title">ZMM OpenZone</div>
      <div id="artist">waiting for start…</div>
      <div id="pos">
        <div id="bar"><div id="fill"></div></div>
        <div id="times"><span id="elapsed">0:00</span><span id="total">0:00</span></div>
      </div>
      <div id="track"></div>
    </div>
  </div>
  <div id="foot"><div id="pulse"></div><div id="detail"></div></div>

  <script>
    const NAMESPACE = 'urn:x-cast:zmm.sync';
    const $ = id => document.getElementById(id);

    let ws = null, ctx = null, sid = null;
    let rate = 44100, channels = 2;
    let trimMs = 0;

    // Clock sync (server time.monotonic() <-> performance.now()/1000)
    // offset = serverTime - localTime. Estimated from ping/pong pairs; the
    // lowest-RTT samples in a sliding window are the trustworthy ones.
    let samples = [];            // {rtt, offset}
    let estOffset = null;        // best current estimate (seconds)
    let appliedOffset = null;    // what scheduling actually uses (slewed)
    let lastRtt = 0;

    const perfSec = () => performance.now() / 1000;

    function onPong(msg) {
      const t1 = perfSec();
      const rtt = t1 - msg.t;
      const offset = (msg.s + rtt / 2) - t1;
      samples.push({ rtt, offset });
      if (samples.length > 12) samples.shift();
      const best = [...samples].sort((a, b) => a.rtt - b.rtt).slice(0, 3);
      estOffset = best.map(s => s.offset).sort((a, b) => a - b)[Math.floor(best.length / 2)];
      lastRtt = best[0].rtt;
      if (appliedOffset === null) appliedOffset = estOffset;
    }

    // Playback stats
    let scheduled = 0, late = 0, resyncs = 0, startedAt = 0;

    // Now playing
    // `at` is a server-clock instant, so the swap waits for the seam to reach
    // the speakers instead of following the decoder, which is a delay line and
    // a device buffer ahead of what anyone can hear.
    let now = null;              // the item currently on screen
    let nowTimer = null;         // pending swap

    const serverNow = () =>
      appliedOffset === null ? null : perfSec() + appliedOffset;

    function onNow(msg) {
      if (nowTimer) { clearTimeout(nowTimer); nowTimer = null; }
      const s = serverNow();
      const wait = (s === null || !msg.at) ? 0 : (msg.at - s) * 1000;
      if (wait <= 0) showNow(msg);
      else nowTimer = setTimeout(() => { nowTimer = null; showNow(msg); }, wait);
    }

    function showNow(msg) {
      now = msg;
      const title = msg.title || 'ZMM OpenZone';
      $('title').textContent = title;
      $('artist').textContent = msg.artist || '';
      $('artist').style.display = msg.artist ? '' : 'none';
      const art = msg.artwork || '';
      // 'block', not '': both start hidden in the stylesheet, and clearing the
      // inline value would hand them straight back to that rule.
      $('art').style.display = art ? 'block' : 'none';
      $('art').style.backgroundImage = art ? `url("${art}")` : '';
      $('bg').style.backgroundImage = art ? `url("${art}")` : '';
      $('bg').style.opacity = art ? '1' : '0';
      $('track').textContent =
        (msg.count > 1) ? `Track ${(msg.index || 0) + 1} of ${msg.count}` : '';
      $('pos').style.display = msg.duration_ms > 0 ? 'block' : 'none';
      $('total').textContent = clock(msg.duration_ms / 1000);
      drawProgress();
    }

    function clock(secs) {
      if (!(secs > 0)) return '0:00';
      const s = Math.floor(secs % 60), m = Math.floor(secs / 60);
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function drawProgress() {
      if (!now || !(now.duration_ms > 0)) return;
      const s = serverNow();
      if (s === null || !now.at) return;
      const dur = now.duration_ms / 1000;
      const elapsed = Math.max(0, Math.min(dur, s - now.at));
      $('fill').style.width = `${(elapsed / dur) * 100}%`;
      $('elapsed').textContent = clock(elapsed);
    }
    setInterval(drawProgress, 500);

    // Chunk scheduling
    function outLatency() {
      return (ctx && (ctx.outputLatency || ctx.baseLatency)) || 0;
    }

    function onChunk(buf) {
      if (!ctx || estOffset === null) return;   // no clock yet — drop
      const dv = new DataView(buf);
      const playAt = dv.getFloat64(0, false);   // server-clock seconds
      const pcm = new Int16Array(buf, 8);
      const frames = pcm.length / channels;

      // Slew the applied offset toward the estimate: max 1 ms per chunk, so
      // chunk boundaries stay (sub-)sample-continuous. A big error (>50 ms)
      // means the clock genuinely jumped — snap and count a resync.
      const err = estOffset - appliedOffset;
      if (Math.abs(err) > 0.05) { appliedOffset = estOffset; resyncs++; }
      else appliedOffset += Math.max(-0.001, Math.min(0.001, err));

      const localTarget = playAt - appliedOffset + trimMs / 1000 - outLatency();
      const when = ctx.currentTime + (localTarget - perfSec());
      if (when < ctx.currentTime + 0.02) { late++; return; }

      const ab = ctx.createBuffer(channels, frames, rate);
      for (let ch = 0; ch < channels; ch++) {
        const out = ab.getChannelData(ch);
        for (let i = 0; i < frames; i++) out[i] = pcm[i * channels + ch] / 32768;
      }
      const src = ctx.createBufferSource();
      src.buffer = ab;
      src.connect(ctx.destination);
      src.start(when);
      scheduled++;
      if (!startedAt) startedAt = perfSec();
      $('pulse').style.opacity = (scheduled % 4 === 0) ? '1' : '.25';
    }

    // Status line + stats reporting
    function heartbeat() {
      if (estOffset !== null) {
        $('detail').textContent =
          `offset ${(appliedOffset * 1000).toFixed(1)} ms · rtt ${(lastRtt * 1000).toFixed(1)} ms` +
          ` · trim ${trimMs} ms · played ${scheduled} · late ${late}`;
      }
      if (ws && ws.readyState === 1 && sid) {
        ws.send(JSON.stringify({
          type: 'stats',
          offset_ms: estOffset === null ? null : +(estOffset * 1000).toFixed(2),
          rtt_ms: +(lastRtt * 1000).toFixed(2),
          out_latency_ms: +(outLatency() * 1000).toFixed(2),
          ctx_rate: ctx ? ctx.sampleRate : 0,
          scheduled, late, resyncs,
          uptime_s: startedAt ? Math.round(perfSec() - startedAt) : 0,
        }));
      }
    }
    setInterval(heartbeat, 5000);

    // WebSocket
    function connect() {
      ws = new WebSocket(`ws://${location.host}/ws`);
      ws.binaryType = 'arraybuffer';
      ws.onopen = () => {
        // Only while there is nothing better on screen: a reconnect must not
        // overwrite the item the speakers are still playing.
        if (!now) $('artist').textContent = 'Connected — syncing clock…';
        ws.send(JSON.stringify({ type: 'hello', sid }));
        let n = 0;
        const ping = () => {
          if (ws.readyState !== 1) return;
          ws.send(JSON.stringify({ type: 'ping', t: perfSec() }));
          n++;
          setTimeout(ping, n < 15 ? 700 : 4000);   // burst first, then keep-alive
        };
        ping();
      };
      ws.onmessage = ev => {
        if (ev.data instanceof ArrayBuffer) { onChunk(ev.data); return; }
        const msg = JSON.parse(ev.data);
        if (msg.type === 'pong') onPong(msg);
        else if (msg.type === 'now') onNow(msg);
        else if (msg.type === 'hello_ack') {
          rate = msg.rate; channels = msg.channels; trimMs = msg.trim_ms || 0;
          if (!now) $('artist').textContent = 'Playing (OpenZone)';
        }
        else if (msg.type === 'trim') trimMs = msg.trim_ms || 0;
      };
      ws.onclose = () => {
        // The item survives the socket: a reconnect a second later should not
        // blank a screen that is still, correctly, showing what is playing.
        if (!now) $('artist').textContent = 'Disconnected — retrying…';
        setTimeout(() => { if (sid) connect(); }, 2000);
      };
    }

    // Cast wiring
    const context = cast.framework.CastReceiverContext.getInstance();
    context.addCustomMessageListener(NAMESPACE, ev => {
      const d = ev.data || {};
      if (d.type === 'start') {
        trimMs = d.trim_ms || 0;
        if (sid === d.sid && ws && ws.readyState === 1) return;  // duplicate start
        sid = d.sid;
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        if (ws) try { ws.close(); } catch (e) {}
        connect();
      }
    });

    const options = new cast.framework.CastReceiverOptions();
    // No CAF media session is used — without this the platform would kill the
    // app as "idle" a few minutes in.
    options.disableIdleTimeout = true;
    context.start(options);
  </script>
</body>
</html>
