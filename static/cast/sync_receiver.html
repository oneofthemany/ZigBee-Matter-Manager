<!DOCTYPE html>
<!--
  ZigBee Manager — OpenZone Cast receiver (docs/open-zone.md §4.4a).

  A transport for the same engine the default receiver is served by: the
  server cuts this device's own stream from the shared timeline, corrects it
  per device, and sends it over a same-origin WebSocket. This page plays the
  blocks back to back and never moves them — every correction is the
  server's — and reports which stream frame is leaving the DAC at what server
  time, the sensor the default receiver can only approximate to ~10 ms.

  It also draws the now-playing screen, stamped with the server-clock instant
  each item is heard (docs/open-zone.md §10.7). Served by the ZMM sync
  listener over plain HTTP so the ws:// socket is same-origin; see
  static/cast/README.md for registration.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>ZMM Sync Receiver</title>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #000; color: #fff;
      font-family: "Roboto", system-ui, sans-serif; overflow: hidden; }

    /* Blurred cover behind everything — on a screened device the art is the
       point, and a hard-edged 320px thumbnail on black is not. */
    #bg { position: fixed; inset: -8vh; background-size: cover;
      background-position: center; filter: blur(7vh) saturate(1.4)
      brightness(.45); transform: scale(1.1); opacity: 0;
      transition: opacity .6s ease; }
    #shade { position: fixed; inset: 0;
      background: radial-gradient(ellipse at center,
        rgba(0,0,0,.25) 0%, rgba(0,0,0,.8) 100%); }

    #wrap { position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; gap: 5vw; padding: 6vh 7vw; }

    #art { width: 46vh; height: 46vh; flex: 0 0 auto; border-radius: 1.6vh;
      background: #151515 center/cover no-repeat;
      box-shadow: 0 2vh 6vh rgba(0,0,0,.65); display: none; }

    #text { min-width: 0; max-width: 52vw; }
    #title { font-size: 6vh; font-weight: 700; line-height: 1.12;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3;
      -webkit-box-orient: vertical; }
    #artist { font-size: 3.4vh; opacity: .72; margin-top: 1.4vh;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #pos { margin-top: 3.4vh; display: none; }
    #bar { height: .7vh; border-radius: .7vh; background: rgba(255,255,255,.22);
      overflow: hidden; }
    #fill { height: 100%; width: 0; background: #fff; border-radius: .7vh; }
    #times { display: flex; justify-content: space-between; margin-top: 1.2vh;
      font-size: 2vh; opacity: .6; font-variant-numeric: tabular-nums; }
    #track { font-size: 2.2vh; opacity: .55; margin-top: 2.2vh;
      letter-spacing: .12em; text-transform: uppercase; }

    /* Session status, deliberately small: it is for whoever is aligning the
       zone, not for whoever is listening to it. */
    #foot { position: fixed; left: 0; right: 0; bottom: 2.2vh;
      display: flex; align-items: center; justify-content: center; gap: 1.4vh;
      font-size: 1.8vh; opacity: .42; font-variant-numeric: tabular-nums; }
    #pulse { width: 1.4vh; height: 1.4vh; border-radius: 50%; background: #2a6;
      opacity: .25; transition: opacity .1s; flex: 0 0 auto; }
  </style>
</head>
<body>
  <div id="bg"></div>
  <div id="shade"></div>
  <div id="wrap">
    <div id="art"></div>
    <div id="text">
      <div id="title">ZMM OpenZone</div>
      <div id="artist">waiting for start…</div>
      <div id="pos">
        <div id="bar"><div id="fill"></div></div>
        <div id="times"><span id="elapsed">0:00</span><span id="total">0:00</span></div>
      </div>
      <div id="track"></div>
    </div>
  </div>
  <div id="foot"><div id="pulse"></div><div id="detail"></div></div>

  <script>
    const NAMESPACE = 'urn:x-cast:zmm.sync';
    const $ = id => document.getElementById(id);

    const START_LEAD = 0.25;     // first block plays this long after it lands
    const LATE_GUARD = 0.02;     // a block due sooner than this is an underrun
    const REPORT_MS = 250;
    const WS_PCM = 1;            // binary: [u8 type][u64 LE frame][s16le pcm]

    let ws = null, ctx = null, sid = null, load = 0;
    let rate = 44100, channels = 2;

    // Clock sync (server time.monotonic() <-> performance.now()/1000).
    // offset = serverTime - localTime, from ping/pong pairs; the lowest-RTT
    // samples in a sliding window are the trustworthy ones. Only reports and
    // the screen use it: playback never schedules against the server clock.
    let samples = [];
    let estOffset = null;
    let lastRtt = 0;

    const perfSec = () => performance.now() / 1000;

    function onPong(msg) {
      const t1 = perfSec();
      const rtt = t1 - msg.t;
      samples.push({ rtt, offset: (msg.s + rtt / 2) - t1 });
      if (samples.length > 12) samples.shift();
      const best = [...samples].sort((a, b) => a.rtt - b.rtt).slice(0, 3);
      estOffset = best.map(s => s.offset).sort((a, b) => a - b)[Math.floor(best.length / 2)];
      lastRtt = best[0].rtt;
    }

    // Playback: blocks back to back in context time, indexed by stream frame.
    // The context runs at the stream's rate, so a block lasts exactly its
    // frames and the platform resamples the whole graph once, at the output.
    let sched = [];              // {frame, n, t0, src}, in start order
    let nextTime = null;         // context time the next block starts at
    let nextFrame = 0;
    let played = 0, underruns = 0, flushes = 0, startedAt = 0;

    function makeContext() {
      try {
        return new AudioContext({ sampleRate: rate, latencyHint: 'playback' });
      } catch (e) {
        return new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function resetAudio() {
      for (const e of sched) { try { e.src.stop(); } catch (_) {} }
      sched = [];
      nextTime = null;
      nextFrame = 0;
    }

    function onPcm(buf) {
      if (!ctx) return;
      const dv = new DataView(buf);
      if (dv.getUint8(0) !== WS_PCM) return;
      const frame = Number(dv.getBigUint64(1, true));
      const pcm = new Int16Array(buf.slice(9));      // copy: offset 9 is unaligned
      const n = pcm.length / channels;
      const t = ctx.currentTime;
      if (nextTime === null || nextTime < t + LATE_GUARD) {
        // First block, or the queue ran dry: start again a lead from now.
        // Either way it shows up in the report as lag, which is the
        // server's to correct.
        if (nextTime !== null) underruns++;
        nextTime = t + START_LEAD;
      } else if (frame !== nextFrame) {
        nextTime += (frame - nextFrame) / rate;     // keep frame <-> time linear
      }
      const ab = ctx.createBuffer(channels, n, rate);
      for (let ch = 0; ch < channels; ch++) {
        const out = ab.getChannelData(ch);
        for (let i = 0; i < n; i++) out[i] = pcm[i * channels + ch] / 32768;
      }
      const src = ctx.createBufferSource();
      src.buffer = ab;
      src.connect(ctx.destination);
      src.start(nextTime);
      sched.push({ frame, n, t0: nextTime, src });
      nextTime += n / ab.sampleRate;
      nextFrame = frame + n;
      played++;
      if (!startedAt) startedAt = perfSec();
      while (sched.length && sched[0].t0 + sched[0].n / rate < t - 2) sched.shift();
      $('pulse').style.opacity = (played % 5 === 0) ? '1' : '.25';
    }

    // A skip: drop everything from `frame` on. The server re-sends from
    // there, from the same frame, so the frame <-> time line is unbroken.
    function onFlush(frame) {
      let cut = null;
      const keep = [];
      for (const e of sched) {
        if (e.frame >= frame) {
          try { e.src.stop(); } catch (_) {}
          if (cut === null || e.t0 < cut) cut = e.t0;
        } else {
          if (e.frame + e.n > frame) {
            const at = e.t0 + (frame - e.frame) / rate;
            try { e.src.stop(at); } catch (_) {}
            e.n = frame - e.frame;
            cut = at;
          }
          keep.push(e);
        }
      }
      sched = keep;
      if (cut !== null) { nextTime = cut; nextFrame = frame; }
      flushes++;
    }

    // Which stream frame is leaving the DAC, and when, in server time.
    function position() {
      if (!ctx || estOffset === null || !sched.length) return null;
      let ct, pt;
      const ts = ctx.getOutputTimestamp ? ctx.getOutputTimestamp() : null;
      if (ts && ts.contextTime > 0 && ts.performanceTime > 0) {
        ct = ts.contextTime;
        pt = ts.performanceTime / 1000;
      } else {
        ct = ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0);
        pt = perfSec();
      }
      for (const e of sched) {
        const dur = e.n / rate;
        if (ct >= e.t0 && ct < e.t0 + dur) {
          return { frame: Math.round(e.frame + (ct - e.t0) * rate), at: pt + estOffset };
        }
      }
      return null;               // before the first block, or in a gap
    }

    function report() {
      if (!ws || ws.readyState !== 1 || !sid) return;
      const p = position();
      ws.send(JSON.stringify(p
        ? { type: 'pos', frame: p.frame, at: p.at, state: 'playing' }
        : { type: 'pos', frame: 0, at: 0, state: 'buffering' }));
    }
    setInterval(report, REPORT_MS);

    function heartbeat() {
      if (estOffset !== null) {
        $('detail').textContent =
          `rtt ${(lastRtt * 1000).toFixed(1)} ms · played ${played}` +
          ` · underruns ${underruns}`;
      }
      if (ws && ws.readyState === 1 && sid) {
        ws.send(JSON.stringify({
          type: 'stats',
          rtt_ms: +(lastRtt * 1000).toFixed(2),
          out_latency_ms: ctx ? +((ctx.outputLatency || ctx.baseLatency || 0) * 1000).toFixed(2) : 0,
          ctx_rate: ctx ? ctx.sampleRate : 0,
          played, underruns, flushes,
          uptime_s: startedAt ? Math.round(perfSec() - startedAt) : 0,
        }));
      }
    }
    setInterval(heartbeat, 5000);

    // A start names a load: a new one drops what this device holds and
    // restarts its media time, which is what a LOAD does on the default
    // receiver. It arrives over Cast first and over the socket after.
    function onStart(d) {
      if (d.sid === sid && d.load === load && ws && ws.readyState === 1) return;
      const sameSocket = d.sid === sid && ws && ws.readyState === 1;
      sid = d.sid;
      load = d.load || 0;
      if (!ctx) ctx = makeContext();
      if (ctx.state === 'suspended') ctx.resume();
      resetAudio();
      if (sameSocket) hello();
      else {
        if (ws) try { ws.onclose = null; ws.close(); } catch (e) {}
        connect();
      }
    }

    function hello() {
      ws.send(JSON.stringify({ type: 'hello', sid, load }));
    }

    function connect() {
      ws = new WebSocket(`ws://${location.host}/ws`);
      ws.binaryType = 'arraybuffer';
      ws.onopen = () => {
        // Only while there is nothing better on screen: a reconnect must not
        // overwrite the item the speakers are still playing.
        if (!now) $('artist').textContent = 'Connected — syncing clock…';
        hello();
        let n = 0;
        const ping = () => {
          if (!ws || ws.readyState !== 1) return;
          ws.send(JSON.stringify({ type: 'ping', t: perfSec() }));
          n++;
          setTimeout(ping, n < 15 ? 700 : 4000);   // burst first, then keep-alive
        };
        ping();
      };
      ws.onmessage = ev => {
        if (ev.data instanceof ArrayBuffer) { onPcm(ev.data); return; }
        const msg = JSON.parse(ev.data);
        if (msg.type === 'pong') onPong(msg);
        else if (msg.type === 'flush') onFlush(msg.frame);
        else if (msg.type === 'start') onStart(msg);
        else if (msg.type === 'now') onNow(msg);
        else if (msg.type === 'hello_ack') {
          rate = msg.rate; channels = msg.channels;
          if (ctx && ctx.sampleRate !== rate) {
            try { ctx.close(); } catch (e) {}
            ctx = makeContext();
          }
          if (!now) $('artist').textContent = 'Playing (OpenZone)';
        }
      };
      ws.onclose = () => {
        // The server notices a closed socket at once and restarts this
        // device with a fresh load, over Cast; nothing is replayed here.
        resetAudio();
        if (!now) $('artist').textContent = 'Disconnected — waiting for the zone…';
      };
    }

    // Now playing
    // `at` is a server-clock instant, so the swap waits for the seam to reach
    // the speakers instead of following the decoder, which is a delay line and
    // a device buffer ahead of what anyone can hear.
    let now = null;              // the item currently on screen
    let nowTimer = null;         // pending swap

    const serverNow = () => estOffset === null ? null : perfSec() + estOffset;

    function onNow(msg) {
      if (nowTimer) { clearTimeout(nowTimer); nowTimer = null; }
      const s = serverNow();
      const wait = (s === null || !msg.at) ? 0 : (msg.at - s) * 1000;
      if (wait <= 0) showNow(msg);
      else nowTimer = setTimeout(() => { nowTimer = null; showNow(msg); }, wait);
    }

    function showNow(msg) {
      now = msg;
      const title = msg.title || 'ZMM OpenZone';
      $('title').textContent = title;
      $('artist').textContent = msg.artist || '';
      $('artist').style.display = msg.artist ? '' : 'none';
      const art = msg.artwork || '';
      // 'block', not '': both start hidden in the stylesheet, and clearing the
      // inline value would hand them straight back to that rule.
      $('art').style.display = art ? 'block' : 'none';
      $('art').style.backgroundImage = art ? `url("${art}")` : '';
      $('bg').style.backgroundImage = art ? `url("${art}")` : '';
      $('bg').style.opacity = art ? '1' : '0';
      $('track').textContent =
        (msg.count > 1) ? `Track ${(msg.index || 0) + 1} of ${msg.count}` : '';
      $('pos').style.display = msg.duration_ms > 0 ? 'block' : 'none';
      $('total').textContent = clock(msg.duration_ms / 1000);
      drawProgress();
    }

    function clock(secs) {
      if (!(secs > 0)) return '0:00';
      const s = Math.floor(secs % 60), m = Math.floor(secs / 60);
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function drawProgress() {
      if (!now || !(now.duration_ms > 0)) return;
      const s = serverNow();
      if (s === null || !now.at) return;
      const dur = now.duration_ms / 1000;
      const elapsed = Math.max(0, Math.min(dur, s - now.at));
      $('fill').style.width = `${(elapsed / dur) * 100}%`;
      $('elapsed').textContent = clock(elapsed);
    }
    setInterval(drawProgress, 500);

    // Cast wiring
    const context = cast.framework.CastReceiverContext.getInstance();
    context.addCustomMessageListener(NAMESPACE, ev => {
      const d = ev.data || {};
      if (d.type === 'start') onStart(d);
    });

    const options = new cast.framework.CastReceiverOptions();
    // No CAF media session is used — without this the platform would kill the
    // app as "idle" a few minutes in.
    options.disableIdleTimeout = true;
    context.start(options);
  </script>
</body>
</html>
