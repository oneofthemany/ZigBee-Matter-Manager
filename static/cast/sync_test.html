<!DOCTYPE html>
<!--
  Cast sync PoC — test bench. Open from the main app origin
  (https://<zmm>:8000/static/cast/sync_test.html): pick two or more speakers,
  Start, listen to the 2 s click track, and drag each trim slider until the
  clicks land together. Stats refresh from /api/media/sync/status.
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZMM Cast Sync PoC</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #10141a; color: #e8ecf1; font-family: system-ui, sans-serif;
      padding: 24px; max-width: 760px; margin: 0 auto; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .sub { opacity: .6; font-size: 13px; margin-bottom: 20px; }
    .card { background: #1a2029; border: 1px solid #2a3342; border-radius: 10px;
      padding: 14px 16px; margin-bottom: 12px; }
    .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .name { font-weight: 600; flex: 1 1 160px; }
    .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px;
      background: #2a3342; }
    .pill.ok { background: #14532d; color: #86efac; }
    button { background: #2563eb; color: #fff; border: 0; border-radius: 8px;
      padding: 10px 18px; font-size: 14px; cursor: pointer; }
    button.stop { background: #7f1d1d; }
    button:disabled { opacity: .4; cursor: default; }
    input[type=checkbox] { width: 18px; height: 18px; }
    input[type=range] { flex: 1 1 200px; accent-color: #2563eb; }
    .trim { font-variant-numeric: tabular-nums; width: 70px; text-align: right; }
    .stats { font-size: 12px; opacity: .65; margin-top: 6px;
      font-variant-numeric: tabular-nums; white-space: pre-wrap; }
    #msg { margin: 12px 0; font-size: 13px; color: #fca5a5; min-height: 18px; }
    #controls { display: flex; gap: 10px; margin: 16px 0; }
  </style>
</head>
<body>
  <h1>Cast sync PoC</h1>
  <div class="sub">Server-clocked click track on multiple speakers — no Google-Home
    group. Positive trim = that speaker plays later.</div>
  <div id="devices">Loading players…</div>
  <div id="controls">
    <button id="start">Start session</button>
    <button id="stop" class="stop">Stop</button>
  </div>
  <div id="msg"></div>

  <script>
    const $ = id => document.getElementById(id);
    const api = (path, body) => fetch(path, body ? {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    } : undefined).then(r => r.json());

    let players = [];            // cast, non-group
    let statusById = {};         // player_id -> device status entry

    function fmtStats(s) {
      if (!s || s.offset_ms == null) return '';
      return `offset ${s.offset_ms} ms · rtt ${s.rtt_ms} ms · outLatency ${s.out_latency_ms} ms`
        + ` · played ${s.scheduled} · late ${s.late} · resyncs ${s.resyncs}`;
    }

    function render() {
      const box = $('devices');
      if (!players.length) {
        box.textContent = 'No cast devices found (is media.cast enabled?)';
        return;
      }
      box.innerHTML = '';
      for (const p of players) {
        const st = statusById[p.player_id];
        const trim = st ? st.trim_ms : 0;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="row">
            <input type="checkbox" data-pick="${p.player_id}" ${st ? 'checked' : ''}>
            <span class="name">${p.name}</span>
            <span class="pill ${st && st.connected ? 'ok' : ''}">
              ${st ? (st.connected ? 'connected' : 'launching…') : 'idle'}</span>
          </div>
          <div class="row" style="margin-top:8px">
            <input type="range" min="-500" max="500" step="5" value="${trim}"
                   data-trim="${p.player_id}">
            <span class="trim" id="trim-${CSS.escape(p.player_id)}">${trim} ms</span>
          </div>
          <div class="stats">${st ? fmtStats(st.stats) : ''}</div>`;
        box.appendChild(card);
      }
      box.querySelectorAll('[data-trim]').forEach(el => {
        el.oninput = () => {
          document.getElementById('trim-' + el.dataset.trim).textContent =
            el.value + ' ms';
        };
        el.onchange = () =>
          api('/api/media/sync/trim',
              { player_id: el.dataset.trim, trim_ms: +el.value });
      });
    }

    async function loadPlayers() {
      try {
        const d = await api('/api/media/players');
        const list = d.players || d || [];
        players = list.filter(p => p.provider === 'cast' && !p.is_group);
      } catch (e) { $('msg').textContent = 'Could not load players: ' + e; }
      render();
    }

    async function poll() {
      try {
        const s = await api('/api/media/sync/status');
        statusById = {};
        (s.devices || []).forEach(d => { statusById[d.player_id] = d; });
        if (s.error) $('msg').textContent = s.error;
        // Re-render only stats/pills so an open slider drag isn't disturbed.
        for (const p of players) {
          const card = document.querySelector(
            `[data-pick="${CSS.escape(p.player_id)}"]`)?.closest('.card');
          if (!card) { render(); return; }
          const st = statusById[p.player_id];
          const pill = card.querySelector('.pill');
          pill.className = 'pill ' + (st && st.connected ? 'ok' : '');
          pill.textContent = st ? (st.connected ? 'connected' : 'launching…') : 'idle';
          card.querySelector('.stats').textContent = st ? fmtStats(st.stats) : '';
        }
      } catch (e) { /* transient */ }
    }

    $('start').onclick = async () => {
      const ids = [...document.querySelectorAll('[data-pick]:checked')]
        .map(el => el.dataset.pick);
      if (!ids.length) { $('msg').textContent = 'Pick at least one speaker.'; return; }
      $('msg').textContent = '';
      const r = await api('/api/media/sync/start', { player_ids: ids });
      if (!r.success) $('msg').textContent = r.error || 'Start failed';
      poll();
    };
    $('stop').onclick = async () => { await api('/api/media/sync/stop'); poll(); };

    loadPlayers();
    poll();
    setInterval(poll, 3000);
  </script>
</body>
</html>
